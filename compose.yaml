services:
  postgres:
    image: postgres:17
    container_name: cinebox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinebox_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      # Si Windows ya usa 5432, mantenemos 5433 solo en localhost.
      - "127.0.0.1:5433:5432"
    volumes:
      - cinebox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinebox_db"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  cinebox_pgdata:
